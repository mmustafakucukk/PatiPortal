<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Giriş yap – PatiPortal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@800&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="ust-menu"></div>

<main id="icerik" class="dar-sayfa">
  <div class="kart">
    <h1>Giriş yap</h1>
    <p class="sayfa-giris" id="giris-aciklama">Başvurularını, randevularını ve destek sözlerini görmek için giriş yap.</p>
    <form id="giris-formu" novalidate>
      <div class="form-alan">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
      </div>
      <div class="form-alan">
        <label for="sifre">Şifre</label>
        <div class="girdi-grubu">
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
          <button class="btn btn-ikon" type="button" id="sifre-goster" aria-controls="sifre"></button>
        </div>
      </div>
      <button class="btn btn-ana btn-blok" type="submit">Giriş yap</button>
    </form>
    <p class="form-alt-baglanti">Hesabın yok mu? <a id="kayit-baglantisi" href="/kayit.html">Kayıt ol</a></p>
  </div>
</main>

<div id="alt-bilgi"></div>
<script type="module" src="/static/js/sayfalar/giris.js"></script>
</body>
</html>
